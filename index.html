<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cura Food - صحتك في صحنك</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <img src="logo.jpg" alt="Logo" height="120">
    <h1>Cura Food</h1>
    <p>أكل صحي، طعم أسطوري</p>
</header>

<main>

<section id="menu">
    <h2>🥗 قائمة المأكولات</h2>

    <div class="menu-grid">

        <div class="card">
            <img src="salad.jpg" alt="">
            <h3>سلطة مشكلة</h3>
            <span class="price">800 DA</span>
            <button onclick="addToCart('سلطة مشكلة',800)">أضف للسلة 🛒</button>
        </div>

        <div class="card">
            <img src="fish.jpg" alt="">
            <h3>سمك مشوي</h3>
            <span class="price">1200 DA</span>
            <button onclick="addToCart('سمك مشوي',1200)">أضف للسلة 🛒</button>
        </div>

        <div class="card">
            <img src="tajine.jpg" alt="">
            <h3>طاجين زيتون</h3>
            <span class="price">1500 DA</span>
            <button onclick="addToCart('طاجين زيتون',1500)">أضف للسلة 🛒</button>
        </div>

    </div>
</section>


<section id="reservation">
    <h2>📅 حجز طاولة + طلب مسبق</h2>

    <form onsubmit="reserveTable(event)">
        <input type="text" id="name" placeholder="الاسم الكامل" required>
        <input type="number" id="persons" placeholder="عدد الأشخاص" required>
        <input type="datetime-local" id="date" required>

        <textarea id="preOrder" placeholder="اكتب الأكلات التي تريد تجهيزها قبل وصولك"></textarea>

        <button type="submit">تأكيد الحجز</button>
    </form>
</section>


<section id="order">
    <h2>🛒 سلة المشتريات</h2>

    <ul id="cart-items">
        <li>السلة فارغة حالياً</li>
    </ul>

    <p><strong>المجموع:</strong> <span id="total-price">0</span> DA</p>

    <form onsubmit="sendOrder(event)">
        <input type="text" id="address" placeholder="العنوان" required>
        <input type="tel" id="phone" placeholder="رقم الهاتف" required>

        <button type="submit">إرسال الطلب عبر واتساب</button>
    </form>
</section>


<section id="rating">
    <h2>⭐ تقييم التطبيق</h2>

    <div class="stars">
        <span onclick="rate(1)">⭐</span>
        <span onclick="rate(2)">⭐</span>
        <span onclick="rate(3)">⭐</span>
        <span onclick="rate(4)">⭐</span>
        <span onclick="rate(5)">⭐</span>
    </div>

    <p id="rate-msg">قم باختيار تقييمك</p>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
