<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cura Food - صحتك في صحنك</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <img src="logo.jpg" alt="Cura Food Logo" height="150" style="max-width: 100%; height: auto;"/>
    <h1>Cura Food</h1>
    <p>صحتك في صحنك</p>
</header>

<main>

    <section id="menu">
        <h2>🥗 قائمة المأكولات</h2>

        <div class="menu-grid">

            <div class="card">
                <img src="salad.jpg" height="260" width="476"/>
                <h3>سلطة مشكلة منعشة</h3>
                <p>خضروات طازجة، فلفل ملون، ذرة، زيت الزيتون.</p>
                <span class="price">800 DA</span>
                <button onclick="addToCart('سلطة مشكلة', 800)">أضف للسلة 🛒</button>
            </div>

            <div class="card">
                <img src="fish.jpg" height="260" width="476"/>
                <h3>سمك مشوي</h3>
                <p>سمك مشوي مع خضروات طازجة.</p>
                <span class="price">1200 DA</span>
                <button onclick="addToCart('سمك مشوي', 1200)">أضف للسلة 🛒</button>
            </div>

            <div class="card">
                <img src="tajine.jpg" height="260" width="476"/>
                <h3>طاجين زيتون</h3>
                <p>طاجين بالدجاج والزيتون.</p>
                <span class="price">1500 DA</span>
                <button onclick="addToCart('طاجين زيتون', 1500)">أضف للسلة 🛒</button>
            </div>

        </div>
    </section>

    <section id="order">
        <h2>🛒 سلة المشتريات</h2>

        <ul id="cart-items">السلة فارغة حالياً</ul>

        <p><strong>المجموع:</strong> <span id="total-price">0</span> DA</p>

        <h3>التوصيل</h3>

        <form onsubmit="sendOrder(event)">
            <input type="text" id="address" placeholder="العنوان" required>
            <input type="tel" id="phone" placeholder="الهاتف" required>
            <button type="submit">إرسال عبر واتساب</button>
        </form>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
